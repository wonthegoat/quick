<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Links</title>
<style>
  :root{
    --bg: #0b0c0f;
    --card: #16171c;
    --card-hover: #1e2027;
    --text: #eaeaee;
    --sub: #8a8d98;
    --border: #24262e;
    --accent: #5b8cff;
    --danger: #e5484d;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0; min-height:100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    display:flex; flex-direction:column; align-items:center; padding: 6vh 6vw 10vh;
  }
  .topbar{ width:100%; max-width: 780px; display:flex; justify-content:space-between; align-items:center; margin-bottom: 24px; }
  .status{ font-size: .75rem; color: var(--sub); }
  button{
    font-family:inherit; font-size:.8rem; font-weight:500; color: var(--sub);
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 14px; cursor:pointer; transition: background .15s ease, color .15s ease;
  }
  button:hover{ background: var(--card-hover); color: var(--text); }
  button.primary{ color:#0b0c0f; background: var(--accent); border-color: var(--accent); }
  button.primary:hover{ opacity:.9; background: var(--accent); }
  .grid{ width:100%; max-width: 780px; display:grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  .card{
    position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 10px; text-decoration:none; color: var(--text); background: var(--card);
    border: 1px solid var(--border); border-radius: 16px; padding: 22px 12px;
    transition: transform .15s ease, background .15s ease, border-color .15s ease, opacity .15s ease;
  }
  .card:hover{ background: var(--card-hover); border-color: #34363f; transform: translateY(-2px); }
  body.editing .card{ cursor: grab; }
  .card.dragging{ opacity: .4; }
  .card.drag-over{ border-color: var(--accent); }
  .icon{ width: 42px; height: 42px; border-radius: 12px; display:flex; align-items:center; justify-content:center; background: #fff; overflow:hidden; }
  .icon img{ width: 24px; height: 24px; }
  .name{ font-size: .85rem; font-weight:500; color: var(--sub); text-align:center; }
  .remove-btn{
    position:absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 6px;
    padding:0; font-size: .8rem; line-height:1; display:none; align-items:center; justify-content:center;
  }
  body.editing .remove-btn{ display:flex; }
  .add-card{
    display:flex; align-items:center; justify-content:center; min-height: 96px;
    border: 1px dashed var(--border); border-radius: 16px; color: var(--sub);
    font-size: 1.6rem; cursor:pointer; display:none; background:none;
  }
  body.editing .add-card{ display:flex; }
  .overlay{ position:fixed; inset:0; background: rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index: 10; }
  .overlay.show{ display:flex; }
  .modal{ background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; width: 100%; max-width: 320px; display:flex; flex-direction:column; gap: 12px; }
  .modal h3{ margin:0 0 4px; font-size: 1rem; }
  .modal input{ font-family:inherit; font-size: .9rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text); }
  .modal input:focus{ outline: 1px solid var(--accent); }
  .modal-actions{ display:flex; justify-content:flex-end; gap: 8px; margin-top: 4px; }
  .hint{ font-size:.75rem; color: var(--sub); margin: -4px 0 0; }
</style>
</head>
<body>

<div class="topbar">
  <span class="status" id="status">Loading…</span>
  <button id="editToggle">Edit</button>
</div>

<div class="grid" id="grid"></div>

<div class="overlay" id="authOverlay">
  <div class="modal">
    <h3 id="authTitle">Enter admin password</h3>
    <input type="password" id="authInput" placeholder="Password" autocomplete="off">
    <p class="hint" id="authHint"></p>
    <div class="modal-actions">
      <button id="authCancel">Cancel</button>
      <button class="primary" id="authSubmit">Unlock</button>
    </div>
  </div>
</div>

<div class="overlay" id="linkOverlay">
  <div class="modal">
    <h3 id="linkModalTitle">Add link</h3>
    <input type="text" id="linkName" placeholder="Name (e.g. Gmail)">
    <input type="url" id="linkUrl" placeholder="https://example.com">
    <input type="text" id="linkIcon" placeholder="Icon slug (optional, e.g. gmail)">
    <p class="hint">Leave icon blank to auto-detect. Browse slugs at simpleicons.org.</p>
    <div class="modal-actions">
      <button id="linkCancel">Cancel</button>
      <button class="primary" id="linkSave">Save</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
  // ====== FILL THESE IN FROM YOUR SUPABASE PROJECT (Settings > API) ======
  const SUPABASE_URL = 'https://fsvoklduissurqdlahoo.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZzdm9rbGR1aXNzdXJxZGxhaG9vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNDIwMDEsImV4cCI6MjEwMDgxODAwMX0.hlNPyZYyPrZacoAIXFCfw3Mxp_gBc7A4oie81cv9454';
  // =========================================================================

  const DEFAULT_PASSWORD = 'makhachev';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const knownIcons = {
    'mail.google.com': 'gmail',
    'classroom.google.com': 'googleclassroom',
    'calendar.google.com': 'googlecalendar',
    'drive.google.com': 'googledrive',
    'docs.google.com': 'googledocs',
    'youtube.com': 'youtube',
    'www.youtube.com': 'youtube',
  };

  function guessIcon(url){
    try{ const host = new URL(url).hostname; return knownIcons[host] || ''; }
    catch(e){ return ''; }
  }

  function iconUrlFor(link){
    const slug = link.icon || guessIcon(link.url);
    if(slug) return `https://cdn.simpleicons.org/${slug}`;
    try{
      const domain = new URL(link.url).hostname;
      return `https://www.google.com/s2/favicons?sz=64&domain=${domain}`;
    }catch(e){ return ''; }
  }

  let links = [];
  let editing = false;
  let editId = null;
  let adminConfig = { password: DEFAULT_PASSWORD, is_set: false };

  const grid = document.getElementById('grid');
  const editToggle = document.getElementById('editToggle');
  const statusEl = document.getElementById('status');

  async function loadLinks(){
    statusEl.textContent = 'Loading…';
    const { data, error } = await sb.from('links').select('*').order('position', { ascending: true });
    if(error){ statusEl.textContent = 'Could not connect to Supabase'; console.error(error); return; }
    links = data;
    statusEl.textContent = 'Synced';
    render();
  }

  async function loadAdminConfig(){
    const { data, error } = await sb.from('admin_config').select('*').eq('id', 1).maybeSingle();
    if(!error && data){
      adminConfig = data;
    }
  }

  // ---- Drag to reorder ----
  let dragSrcId = null;

  function attachDragHandlers(card, link){
    card.draggable = true;
    card.addEventListener('dragstart', (e) => {
      dragSrcId = link.id;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    });
    card.addEventListener('dragover', (e) => {
      e.preventDefault();
      if(link.id !== dragSrcId) card.classList.add('drag-over');
    });
    card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
    card.addEventListener('drop', async (e) => {
      e.preventDefault();
      card.classList.remove('drag-over');
      if(dragSrcId === null || dragSrcId === link.id) return;
      const fromIndex = links.findIndex(l => l.id === dragSrcId);
      const toIndex = links.findIndex(l => l.id === link.id);
      const [moved] = links.splice(fromIndex, 1);
      links.splice(toIndex, 0, moved);
      dragSrcId = null;
      render();
      await persistPositions();
    });
  }

  async function persistPositions(){
    statusEl.textContent = 'Saving order…';
    await Promise.all(links.map((l, i) => sb.from('links').update({ position: i }).eq('id', l.id)));
    statusEl.textContent = 'Synced';
  }

  function render(){
    grid.innerHTML = '';
    links.forEach((link) => {
      const card = document.createElement(editing ? 'div' : 'a');
      card.className = 'card';
      if(!editing){
        card.href = link.url;
        card.target = '_blank';
        card.rel = 'noopener noreferrer';
      }
      card.innerHTML = `
        <div class="icon"><img src="${iconUrlFor(link)}" alt=""></div>
        <div class="name">${link.name}</div>
        ${editing ? '<button class="remove-btn" title="Remove">&times;</button>' : ''}
      `;
      if(editing){
        attachDragHandlers(card, link);
        card.addEventListener('click', async (e) => {
          if(e.target.classList.contains('remove-btn')){
            await sb.from('links').delete().eq('id', link.id);
            await loadLinks();
            render();
          } else {
            openLinkModal(link);
          }
        });
      }
      grid.appendChild(card);
    });

    if(editing){
      const addCard = document.createElement('button');
      addCard.className = 'add-card';
      addCard.textContent = '+';
      addCard.addEventListener('click', () => openLinkModal(null));
      grid.appendChild(addCard);
    }
  }

  // ---- Auth modal ----
  const authOverlay = document.getElementById('authOverlay');
  const authInput   = document.getElementById('authInput');
  const authHint    = document.getElementById('authHint');
  const authTitle   = document.getElementById('authTitle');

  function openAuth(){
    authTitle.textContent = 'Enter admin password';
    authHint.textContent = adminConfig.is_set ? '' : `This password hasn't been set yet — try the default, then you'll be asked to set a permanent one.`;
    authHint.style.color = 'var(--sub)';
    authInput.value = '';
    authOverlay.classList.add('show');
    authInput.focus();
  }
  document.getElementById('authCancel').addEventListener('click', () => authOverlay.classList.remove('show'));
  document.getElementById('authSubmit').addEventListener('click', submitAuth);
  authInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') submitAuth(); });

  async function submitAuth(){
    if(authInput.value === adminConfig.password){
      authOverlay.classList.remove('show');
      await enterEditMode();
    }else{
      authHint.textContent = 'Incorrect password. Try again.';
      authHint.style.color = 'var(--danger)';
    }
  }

  async function enterEditMode(){
    editing = true;
    document.body.classList.add('editing');
    editToggle.textContent = 'Done';
    render();

    // One-time-ever password set: only offered if no one has set it yet, anywhere.
    if(!adminConfig.is_set){
      let newPass = '';
      while(!newPass){
        newPass = prompt('Set the permanent admin password (required, one-time only — this cannot be changed again from this page):');
      }
      const { error } = await sb.from('admin_config').upsert({ id: 1, password: newPass, is_set: true });
      if(!error){ adminConfig = { id: 1, password: newPass, is_set: true }; }
    }
  }

  editToggle.addEventListener('click', () => {
    if(editing){
      editing = false;
      document.body.classList.remove('editing');
      editToggle.textContent = 'Edit';
      render();
    } else {
      openAuth();
    }
  });

  // ---- Add/edit link modal ----
  const linkOverlay = document.getElementById('linkOverlay');
  const linkName = document.getElementById('linkName');
  const linkUrl  = document.getElementById('linkUrl');
  const linkIcon = document.getElementById('linkIcon');
  const linkModalTitle = document.getElementById('linkModalTitle');

  function openLinkModal(link){
    editId = link ? link.id : null;
    linkModalTitle.textContent = link ? 'Edit link' : 'Add link';
    linkName.value = link ? link.name : '';
    linkUrl.value = link ? link.url : '';
    linkIcon.value = link ? (link.icon || '') : '';
    linkOverlay.classList.add('show');
    linkName.focus();
  }
  document.getElementById('linkCancel').addEventListener('click', () => linkOverlay.classList.remove('show'));
  document.getElementById('linkSave').addEventListener('click', async () => {
    const name = linkName.value.trim();
    let url = linkUrl.value.trim();
    const icon = linkIcon.value.trim();
    if(!name || !url) return;
    if(!/^https?:\/\//i.test(url)) url = 'https://' + url;

    if(editId === null){
      const position = links.length ? Math.max(...links.map(l => l.position || 0)) + 1 : 0;
      await sb.from('links').insert({ name, url, icon: icon || null, position });
    }else{
      await sb.from('links').update({ name, url, icon: icon || null }).eq('id', editId);
    }
    linkOverlay.classList.remove('show');
    await loadLinks();
    render();
  });

  (async () => {
    await loadAdminConfig();
    await loadLinks();
  })();
</script>

</body>
</html>
